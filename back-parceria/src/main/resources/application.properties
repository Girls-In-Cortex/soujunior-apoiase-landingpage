spring.application.name=back-parceria
server.port=${PORT:8080}

# Carrega o .env da pasta raiz ou da pasta do módulo
spring.config.import=optional:file:.env[.properties],optional:file:back-parceria/.env[.properties]

# Mapeia as variáveis do .env para as propriedades injetadas pelo @Value
gmail.client.id=${GMAIL_CLIENT_ID}
gmail.client.secret=${GMAIL_CLIENT_SECRET}
gmail.refresh.token=${GMAIL_REFRESH_TOKEN}
app.email.destino=${EMAIL_DESTINO:soujunior.parcerias@gmail.com}