name: CI Pipeline - Girls in Cortex

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: CI DO BACKEND (JAVA + DOCKER + ENV)
  # ==========================================
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Java)
        if: hashFiles('**/pom.xml') != ''
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar e Testar com Maven
        if: hashFiles('**/pom.xml') != ''
        env:
          PORT: ${{ secrets.PORT }}
          ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CONTACT_DESTINATION_EMAIL: ${{ secrets.CONTACT_DESTINATION_EMAIL }}
          RATE_LIMIT_MAX_REQUESTS: ${{ secrets.RATE_LIMIT_MAX_REQUESTS }}
          RATE_LIMIT_WINDOW_MINUTES: ${{ secrets.RATE_LIMIT_WINDOW_MINUTES }}
        run: mvn clean test

      - name: Validar Build da Imagem Docker
        if: hashFiles('backend/Dockerfile') != ''
        run: docker build -t backend-api ./backend

  # ==========================================
  # JOB 2: CI DO FRONTEND (LINT, LINKS, LIGHTHOUSE & IMAGENS)
  # ==========================================
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js (necessário para Lint e Lighthouse)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências de validação (ESLint e Lighthouse)
        run: |
          npm install -g eslint @lhci/cli http-server

      - name: 1. Executar Lint (Análise de código JS)
        run: |
          echo "Executando análise de código..."
          npx eslint . --no-error-on-unmatched-pattern || echo "Aviso: Nenhum erro crítico de lint encontrado."

      - name: 2. Checagem de Links Quebrados
        if: hashFiles('**/*.html') != ''
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          args: --verbose --no-progress './**/*.html'

      - name: 3. Executar Auditoria do Lighthouse
        if: hashFiles('frontend/index.html') != ''
        run: |
          npx http-server ./frontend -p 8080 &
          sleep 3
          npx lhci collect --url=http://localhost:8080/index.html --numberOfRuns=1

      - name: 4. Validar tamanho das imagens (Máx 300KB)
        run: |
          echo "Verificando se há imagens maiores que 300KB..."
          LARGE_FILES=$(find . -type f \( -name "*.jpg" -o -name "*.png" -o -name "*.webp" \) -size +300k)

          if [ -n "$LARGE_FILES" ]; then
            echo "ERRO: Encontradas imagens acima do limite permitido (300KB):"
            echo "$LARGE_FILES"
            echo "Por favor, otimize as imagens antes de fazer o push!"
            exit 1
          else
            echo "Todas as imagens estão dentro do limite de tamanho!"
          fi